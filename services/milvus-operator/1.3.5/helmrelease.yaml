---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${releaseName}-helmrelease
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: milvus-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-1.3.5-chart
        namespace: ${releaseNamespace}
      version: 1.3.5
  interval: 15s
  install:
    createNamespace: true
    crds: CreateReplace
  targetNamespace: ${releaseName}
  releaseName: milvus-operator
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-1.3.5-defaults
    - kind: ConfigMap
      name: ${releaseName}-overrides
      optional: true
