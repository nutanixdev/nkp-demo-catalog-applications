---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: milvus-operator
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: milvus-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: milvus-operator
        namespace: ${releaseNamespace}
      version: 1.3.5
  interval: 1m0s
  install:
    createNamespace: true
    crds: CreateReplace
  targetNamespace: milvus-operator
  releaseName: milvus-operator
  valuesFrom:
    - kind: ConfigMap
      name: milvus-operator-1.3.5-defaults
    - kind: ConfigMap
      name: milvus-operator-overrides
      optional: true
