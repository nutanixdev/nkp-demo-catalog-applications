apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${releaseName}
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: milvus-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}
        namespace: ${releaseNamespace}
      version: ${appVersion}
  interval: 15s
  install:
    remediation:
      retries: 30
    createNamespace: true
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 30
  releaseName: milvus-operator
  targetNamespace: ${releaseName}
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-defaults
