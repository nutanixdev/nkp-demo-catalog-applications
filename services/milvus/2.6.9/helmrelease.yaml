---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: milvus
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: milvus
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: milvus
        namespace: ${releaseNamespace}
  interval: 15s
  install:
    crds: CreateReplace
    remediation:
      retries: 30
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  releaseName: milvus
  targetNamespace: ${releaseNamespace}
  valuesFrom:
    - kind: ConfigMap
      name: milvus-2.6.9-defaults
    - kind: ConfigMap
      name: milvus-overrides
      optional: true
